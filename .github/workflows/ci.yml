name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.5"
      - name: Install Python
        run: uv python install
      - name: Check dependency lock
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Verify exact ordinary-GIL CPython
        run: |
          uv run --frozen --all-groups python - <<'PY'
          import platform
          import sys
          import sysconfig

          assert platform.python_implementation() == "CPython"
          assert sys.version_info[:3] == (3, 14, 7), sys.version
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 0
          assert sys._is_gil_enabled()
          print(f"{platform.python_implementation()} {platform.python_version()}, ordinary GIL enabled")
          PY
      - name: Dependency vulnerability audit
        shell: bash
        run: |
          audit_dir="${RUNNER_TEMP}/mma-pip-audit"
          mkdir -p "${audit_dir}/cache"
          uv export \
            --frozen \
            --all-groups \
            --no-emit-project \
            --no-header \
            --format pylock.toml \
            --output-file "${audit_dir}/pylock.toml" \
            > /dev/null
          uv run --frozen --all-groups pip-audit \
            --locked "${audit_dir}" \
            --strict \
            --vulnerability-service pypi \
            --cache-dir "${audit_dir}/cache" \
            --progress-spinner off \
            --timeout 30
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Strict Pyright
        run: uv run pyright
      - name: Tests
        run: uv run pytest
      - name: Pre-commit
        run: uv run pre-commit run --all-files
      - name: Build package
        run: uv build
