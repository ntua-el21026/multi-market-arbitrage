[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "multi-market-arbitrage"
version = "0.1.0"
description = "Read-only multi-market arbitrage research foundation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.3,<2",
    "httpx>=0.28.1,<1",
    "pyarrow>=21,<24",
    "pydantic>=2.11,<3",
    "websockets>=15,<17",
    "zstandard>=0.23,<1",
]

[project.scripts]
mma = "multi_market_arbitrage.cli.main:main"

[dependency-groups]
dev = [
    "hatchling==1.32.0",
    "hypothesis>=6.135,<7",
    "pre-commit>=4.2,<5",
    "pyarrow-stubs==20.0.0.20260819",
    "pyright[nodejs]>=1.1.403,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multi_market_arbitrage"]

[tool.pytest.ini_options]
# WSL commonly inherits TEMP/TMP paths on DrvFs. Pytest's fd-capture temporary
# file can then disappear underneath collection; sys capture is portable and
# still preserves Python-level test output and logging assertions.
addopts = "--strict-config --strict-markers --capture=sys"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "I",
    "PERF",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
