[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "multi-market-arbitrage"
version = "0.1.0"
description = "Read-only multi-market arbitrage research foundation"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "duckdb==1.5.5",
    "httpx==0.28.1",
    "pyarrow==25.0.1",
    "pydantic==2.13.4",
    "websockets==17.0.1",
    "zstandard==0.25.0",
]

[project.scripts]
mma = "multi_market_arbitrage.cli.main:main"

[dependency-groups]
dev = [
    "hatchling==1.32.0",
    "hypothesis==6.165.10",
    "pre-commit==4.6.2",
    "pyarrow-stubs==20.0.0.20260819",
    "pyright[nodejs]==1.1.411",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.4",
]
security = ["pip-audit==2.10.1"]

[tool.uv]
prerelease = "disallow"
required-version = "==0.12.5"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_market_arbitrage"]

[tool.pytest.ini_options]
# WSL commonly inherits TEMP/TMP paths on DrvFs. Pytest's fd-capture temporary
# file can then disappear underneath collection; sys capture is portable and
# still preserves Python-level test output and logging assertions.
addopts = "--strict-config --strict-markers --capture=sys"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "I",
    "PERF",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
